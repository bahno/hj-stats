<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Rank — World Athletics ranking lookup</title>
    <meta
      name="description"
      content="Look up an athlete's World and European ranking in any of the 36 World Athletics track and field event groups, and track their Road to Birmingham 2026 qualification."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Track Rank — World Athletics ranking lookup" />
    <meta
      property="og:description"
      content="World and European athlete rankings across all 36 track and field event groups, plus Road to Birmingham 2026 qualification tracking."
    />
    <meta property="og:image" content="https://bahno.info/apple-touch-icon.png" />
    <meta property="og:url" content="https://bahno.info/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0a0d10" />
    <link rel="canonical" href="https://bahno.info/" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f6f7' : '#0a0d10');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
